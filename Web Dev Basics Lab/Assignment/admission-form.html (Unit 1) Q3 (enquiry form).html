<form action="/submit-enquiry" method="post">

  <label for="name">Applicant Name:</label>
  <input type="text" id="name" name="applicantName" required><br><br>

  <p>Class Applied For:</p>
  <input type="radio" id="class9" name="classApplied" value="9">
  <label for="class9">Class 9</label><br>

  <input type="radio" id="class10" name="classApplied" value="10">
  <label for="class10">Class 10</label><br>

  <input type="radio" id="class11" name="classApplied" value="11">
  <label for="class11">Class 11</label><br><br>

  <p>Subjects of Interest:</p>
  <input type="checkbox" id="science" name="subjects" value="Science">
  <label for="science">Science</label><br>

  <input type="checkbox" id="math" name="subjects" value="Math">
  <label for="math">Mathematics</label><br>

  <input type="checkbox" id="cs" name="subjects" value="ComputerScience">
  <label for="cs">Computer Science</label><br><br>

  <input type="submit" value="Submit Enquiry">
</form>
