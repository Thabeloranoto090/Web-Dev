<!DOCTYPE html>
<html lang="en">
<head>
  <title>CSS Methods Demo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Internal CSS */
    p.internal {
      color: green;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h2>Inline CSS</h2>
  <p style="color: navy; font-size: 18px; line-height: 1.6;">
    Web development combines structure, style, and interactivity.
  </p>

  <h2>Internal CSS</h2>
  <p class="internal">
    Web development combines structure, style, and interactivity.
  </p>

  <h2>External CSS</h2>
  <p class="external">
    Web development combines structure, style, and interactivity.
  </p>

</body>
</html>
