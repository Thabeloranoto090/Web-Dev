<html>
<head>
    <title>Header and Footer</title>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <main>
        <h2>About Me</h2>
        <p>This is the main content of my webpage.</p>
    </main>

    <footer>
        <p>Copyright © 2026 My Website</p>
    </footer>

</body>
</html>
<style>
    header {
        background-color: lightblue;
        text-align: center;
        padding: 20px;
    }

    footer {
        background-color: lightgray;
        text-align: center;
        padding: 10px;
    }
</style>
